name: Build Android APK
on: [push]

env:
  APP_VERSION_CODE: 3
  APP_VERSION_NAME: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Icon File
        run: |
          if [ ! -f "icon.png" ]; then
            echo "❌ Error: icon.png not found in repository root!"
            exit 1
          fi
          echo "✅ Icon file found"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --force

      - name: Build Web Project
        run: |
          npm run build -- --base=./ || npm run build || true
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
          fi
          echo "✅ Web project built successfully"

      - name: Setup Capacitor Config
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.asadullah.mathmind",
            "appName": "Math Mind",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF
          npx cap add android || true
          npx cap sync android
          echo "✅ Capacitor configured"

      - name: Set App Icon and Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          ICON_SRC="icon.png"
          RES_DIR="android/app/src/main/res"
          
          # Remove old resources
          rm -rf $RES_DIR/mipmap-anydpi-v26
          
          # Create directories
          mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi
          
          # Generate icons
          convert $ICON_SRC -resize 48x48   $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert $ICON_SRC -resize 72x72   $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert $ICON_SRC -resize 96x96   $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert $ICON_SRC -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert $ICON_SRC -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          # Generate rounded icons
          convert $ICON_SRC -resize 48x48   $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 72x72   $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 96x96   $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          
          # Generate splash screens
          mkdir -p $RES_DIR/drawable
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable/splash.png
          mkdir -p $RES_DIR/drawable-land-hdpi $RES_DIR/drawable-port-hdpi
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable-land-hdpi/splash.png
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable-port-hdpi/splash.png
          
          echo "✅ Icons and splash screens generated"

      - name: Set Kotlin Version
        run: |
          echo "kotlin.version=1.8.22" >> android/gradle.properties
          echo "✅ Kotlin version set"

      - name: Setup Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ Error: KEYSTORE_BASE64 secret not found!"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mathmind.jks
          chmod 600 android/app/mathmind.jks
          
          if [ ! -f "android/app/mathmind.jks" ]; then
            echo "❌ Error: Keystore file not created!"
            exit 1
          fi
          echo "✅ Keystore setup complete"

      - name: Build Android APK (Release - Signed)
        run: |
          cd android
          
          # Update version information
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.APP_VERSION_CODE }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ env.APP_VERSION_NAME }}\"/" app/build.gradle
          
          # Add Kotlin configuration
          echo "configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }" >> app/build.gradle
          
          chmod +x gradlew
          
          # Build with signing
          echo "🔨 Building APK with signing..."
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/mathmind.jks \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace
          
          # Verify APK was created
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "❌ APK build failed!"
            exit 1
          fi
          
          # Check APK size
          APK_SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
          echo "✅ APK created successfully - Size: $APK_SIZE"
          
          # Rename APK
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MathMind.apk

      - name: Check APK Signature
        run: |
          cd android
          jarsigner -verify -verbose app/build/outputs/apk/release/MathMind.apk | head -20
          echo "✅ APK signature verified"

      - name: Push APK to repo
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/MathMind.apk download/MathMind.apk
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add download/MathMind.apk
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Release MathMind v${{ env.APP_VERSION_NAME }} (build ${{ github.run_number }}) [skip ci]"
            git push
            echo "✅ APK pushed to repository"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMind-v${{ env.APP_VERSION_NAME }}
          path: android/app/build/outputs/apk/release/MathMind.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "=========================================="
          echo "✅ Build Completed Successfully!"
          echo "=========================================="
          echo "App Version: ${{ env.APP_VERSION_NAME }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "APK Location: download/MathMind.apk"
          echo "=========================================="
