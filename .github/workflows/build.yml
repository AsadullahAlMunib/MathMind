name: Build Android APK
on: [push]

env:
  APP_VERSION_CODE: 3
  APP_VERSION_NAME: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --force

      - name: Build Web Project
        run: |
          npm run build -- --base=./ || npm run build || true
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
          fi

      - name: Setup Capacitor Config
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.asadullah.mathmind",
            "appName": "Math Mind",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF
          npx cap add android || true
          npx cap sync android

      - name: Set App Icon and Splash Screen
        run: |
          sudo apt-get install -y imagemagick
          ICON_SRC="icon.png"
          RES_DIR="android/app/src/main/res"
          rm -rf $RES_DIR/mipmap-anydpi-v26
          mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi
          convert $ICON_SRC -resize 48x48   $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert $ICON_SRC -resize 72x72   $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert $ICON_SRC -resize 96x96   $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert $ICON_SRC -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert $ICON_SRC -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          convert $ICON_SRC -resize 48x48   $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 72x72   $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 96x96   $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert $ICON_SRC -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          mkdir -p $RES_DIR/drawable
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable/splash.png
          mkdir -p $RES_DIR/drawable-land-hdpi $RES_DIR/drawable-port-hdpi
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable-land-hdpi/splash.png
          convert $ICON_SRC -resize 512x512 $RES_DIR/drawable-port-hdpi/splash.png

      - name: Set Kotlin Version
        run: echo "kotlin.version=1.8.22" >> android/gradle.properties

      - name: Build Android APK
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.APP_VERSION_CODE }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ env.APP_VERSION_NAME }}\"/" app/build.gradle
          echo "configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }" >> app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MathMind.apk

      - name: Push APK to repo
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/MathMind.apk download/MathMind.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add download/MathMind.apk
          git diff --staged --quiet || git commit -m "Release MathMind v${{ env.APP_VERSION_NAME }} (build ${{ github.run_number }}) [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMind-v${{ env.APP_VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/MathMind.apk
